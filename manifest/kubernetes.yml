# MINIKUBE FUNCIONA EN CODESPACE | LOCAL
# KUBECTL FUNCIONA DIRECTO EN KILLERCODA (SIN MINIKUBE)

# consultar versión de minikube
minikube version

# consultar si minikube esta en start o stop
minikube status

# iniciar clúster kubernetes
minikube start

# ingresar a la carpeta de los manifiestos de kubernetes (manifest)
cd manifest

# listar namespace
kubectl get namespace
kubectl get ns

# crear un namespace "juan" por comando mediante un archivo: "briseyda-arbizu-01-namespace.yml"
kubectl apply -f briseyda-arbizu-01-namespace.yml

# consultar namespace en uso por "default" | LINUX
kubectl config view --minify | grep namespace

# consultar namespace en uso por "default" | WINDOWS
kubectl config view --minify | findstr namespace

# cambiar un namespace en uso por "default" a "briseyda-arbizu-01-namespace"
kubectl config set-context --current --namespace=briseyda-arbizu-01-namespace

# consultar todos los recursos de un namespace "briseyda-arbizu-01-namespace"
kubectl get all -n briseyda-arbizu-01-namespace

# consultar todos los recursos y secret de un namespace "briseyda-arbizu-01-namespace"
kubectl get all,secrets -n briseyda-arbizu-01-namespace


# listar services del namespace "briseyda-arbizu-01-namespace"
minikube service briseyda-arbizu-01-service -n briseyda-arbizu-01-namespace
minikube service list

# probar el microservicio dentro del clúster con curl
curl http://192.168.49.2:30001/api/v1/ia/listar
curl http://192.168.49.2:30001/v1/api/ia-image-processor/1

# crear un túnel de puerto la máquina local (host) y el clúster de Kubernetes
kubectl port-forward service/briseyda-arbizu-01-service 8085:30001